global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Sprint 33: load the recommended alert rules so AlertManager (when
# wired by the operator) fires on SLA backlog, 5xx burst, AI errors,
# stuck push endpoints and abnormal MPPS DISCONTINUED rates.
rule_files:
  - "/etc/prometheus/telerady-alerts.yml"

scrape_configs:
  - job_name: telerady-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
