global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The API exposes /metrics with default NestJS-pino + custom counters
  # (Sprint 17 will add a prom-client middleware). Until then we point
  # Prometheus at the host so dev can already see it being scraped.
  - job_name: telerady-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
