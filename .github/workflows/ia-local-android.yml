name: IA Local (Android APK)

on:
  push:
    paths:
      - "apps/ia-local/**"
      - ".github/workflows/ia-local-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ia-local
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "IA-Local-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IA-Local-apk
          path: apps/ia-local/IA-Local-*.apk
          if-no-files-found: error

      - name: Publicar en Releases (descarga fácil desde el móvil)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ia-local-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ia-local-latest "IA-Local-${VERSION_CODE}.apk" \
            --target "${GITHUB_SHA}" --prerelease \
            --title "IA Local (build ${VERSION_CODE})" \
            --notes "APK generado automáticamente desde ${GITHUB_REF_NAME}. Instálalo en Android 9 o superior (arm64)."
