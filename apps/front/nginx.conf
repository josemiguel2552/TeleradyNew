# Telerady SPA — nginx server block.
#
# Listens on 8080 (non-privileged so the container can run as the
# `nginx` user). Routes that don't map to a static file fall back
# to index.html for client-side routing. /healthz is a flat 200 for
# the Docker HEALTHCHECK + K8s probes. The API base URL is baked
# into the bundle at build time, so this server only serves static
# files — it does NOT proxy to the backend; we rely on the
# Kubernetes Ingress (or local nginx) for that wiring.

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (the ones we can set from a static SPA host;
    # CSP is configured by the back / ingress so cookies and the
    # SwaggerUI loader keep working without a duplicate header.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # gzip for textual assets only.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # Long-lived cache for fingerprinted Angular assets.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — anything else returns index.html so Angular
    # router can take over. Disable cache on the entry document so
    # a deploy is picked up on the next refresh.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
