<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Telerady</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b5394" />

    <!--
      Local Poppins is loaded from @fontsource/poppins via styles.scss to avoid
      a third-party connection on every page load (RGPD-friendly).
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0"
    />

    <!--
      Third-party analytics (Google Tag Manager, Hotjar, Meta Pixel) were
      removed in Sprint 0. They were loading unconditionally, bypassing the
      RGPD consent requirement. They will return — if business decides — only
      after the consent banner and the legitimate-interest assessment are in
      place (Sprint 6).
    -->

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
